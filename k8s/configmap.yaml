apiVersion: v1
kind: ConfigMap
metadata:
  name: secureshare-config
  namespace: secureshare
data:
  APP_ENV: "production"
  PORT: "8000"
  ALLOWED_ORIGINS: "https://secureshare.local,http://localhost:3000,http://localhost:5173"
  STORAGE_ROOT: "/app/storage"
  UPLOADS_DIR: "/app/storage/uploads"
  QUARANTINE_DIR: "/app/storage/quarantine"
  LOG_LEVEL: "INFO"
  RATE_LIMIT_PER_MINUTE: "60"
  MAX_FILE_SIZE_MB: "50"
  CLAMAV_HOST: "clamav-service.secureshare.svc.cluster.local"
  CLAMAV_PORT: "3310"
