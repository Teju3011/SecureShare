apiVersion: v1
kind: Secret
metadata:
  name: secureshare-secrets
  namespace: secureshare
type: Opaque
stringData:
  # Cryptographic Master Keys (Must be >= 256 bits of entropy)
  SECRET_KEY: "CHANGEME_REPLACE_WITH_CRYPTOGRAPHICALLY_SECURE_RANDOM_SECRET_KEY"
  MASTER_ENCRYPTION_KEY: "CHANGEME_REPLACE_WITH_BASE64_32_BYTE_MASTER_ENCRYPTION_KEY"
  
  # Database Credentials
  POSTGRES_DB: "secureshare"
  POSTGRES_USER: "secureshare_user"
  POSTGRES_PASSWORD: "CHANGEME_STRONG_POSTGRES_PRODUCTION_PASSWORD"
  DATABASE_URL: "postgresql://secureshare_user:CHANGEME_STRONG_POSTGRES_PRODUCTION_PASSWORD@postgres-service.secureshare.svc.cluster.local:5432/secureshare"
