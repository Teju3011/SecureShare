# SonarQube Scanner Configuration for SecureShare
sonar.projectKey=secureshare
sonar.projectName=SecureShare - Secure File Sharing & DevSecOps Platform
sonar.projectVersion=1.0.0

# Source & Test Codepaths
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,tests/security,security/fuzzing
sonar.exclusions=**/venv/**,**/node_modules/**,**/dist/**,**/build/**,**/storage/**,**/*.db

# Python Specifics
sonar.python.version=3.11,3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.bandit.reportPaths=security/reports/bandit_report.json

# JavaScript / TypeScript Specifics
sonar.typescript.tsconfigPath=frontend/tsconfig.json
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate Thresholds
sonar.qualitygate.wait=true
sonar.qualitygate.critical=0
sonar.qualitygate.high=0
